MEMORY {
  ZP:      start = $0010, size = $00F0, type = rw, define = yes;
  HEADER:  start = $0000, size = $0010, file = %O, fill = yes;
  BANK0:   start = $A000, size = $2000, file = %O, fill = yes;
  OVLI:    start = $A000, size = $4000, file = %O, fill = yes;
  OVLE:    start = $A000, size = $4000, file = %O, fill = yes;
  BANK5:   start = $C000, size = $2000, file = %O, fill = yes;
  FIXA:    start = $8000, size = $2000, file = %O, fill = yes;
  FIXB:    start = $E000, size = $1FFA, file = %O, fill = yes;
  VEC:     start = $FFFA, size = $0006, file = %O, fill = yes;
  RAM:     start = $0300, size = $0500, define = yes;
  STAGEM:  start = $6000, size = $0100;
  SAVEMEM: start = $6100, size = $0710;
  LOGMEM:  start = $6810, size = $06F0;
  RUNMEM:  start = $6F00, size = $0DA0;
  SPILLM:  start = $7CA0, size = $0360;
}

SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  HEADER:   load = HEADER, type = ro;
  ICODE:    load = OVLI, type = ro;
  IRODATA:  load = OVLI, type = ro;
  ECODE:    load = OVLE, type = ro;
  ERODATA:  load = OVLE, type = ro;
  FONT:     load = BANK5, type = ro, define = yes;
  DEMOS:    load = BANK5, type = ro;
  CODE:     load = FIXA, type = ro;
  HCODE:    load = FIXA, type = ro;
  STARTUP:  load = FIXB, type = ro;
  ONCE:     load = FIXB, type = ro, optional = yes;
  RODATA:   load = FIXB, type = ro;
  DATA:     load = FIXB, run = RAM, type = rw, define = yes;
  BSS:      load = RAM, type = bss, define = yes;
  STAGE:    load = STAGEM, type = bss, align = $100;
  SAVE:     load = SAVEMEM, type = bss;
  LOGTXT:   load = LOGMEM, type = bss;
  RUNRAM:   load = RUNMEM, type = bss;
  SPILL:    load = SPILLM, type = bss;
  VECTORS:  load = VEC, type = ro;
}
